<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D交互制作器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21.5"/></svg>
      </span>
      <span data-i18n="3D交互制作器">3D交互制作器</span>
      <span class="version-badge" id="version-badge">v26.0.3</span>
    </div>
    <div class="nav-group topbar-project">
      <button class="btn" id="btn-projects" title="返回项目列表，切换或管理项目" data-i18n-title="返回项目列表，切换或管理项目">项目</button>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-group topbar-file">
      <div class="dropdown">
        <button class="btn" id="btn-file" title="文件操作" aria-haspopup="true" aria-expanded="false">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></span><span data-i18n="文件">文件</span>
          <span class="caret" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="dropdown-panel" id="file-menu" hidden>
          <div class="dd-group">
            <button class="dd-item" id="btn-import" title="打开 / 导入项目文件（整个项目）" data-i18n-title="打开 / 导入项目文件（整个项目）">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M8 13l4-4 4 4"/><path d="M4 5v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V5"/></svg></span>
              <span class="dd-text"><b data-i18n="打开本地工程">打开本地工程</b><small data-i18n="打开 / 导入项目文件（整个项目）">打开 / 导入项目文件（整个项目）</small></span>
            </button>
            <button class="dd-item" id="btn-save-project" title="保存整个项目为本地项目文件（含模型·音效·交互）" data-i18n-title="保存整个项目为本地项目文件（含模型·音效·交互）">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></span>
              <span class="dd-text"><b data-i18n="保存工程到本地">保存工程到本地</b><small data-i18n="含模型·音效·交互">含模型·音效·交互</small></span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="nav-sep"></div>
    <div class="crumbs" id="crumbs"></div>

    <!-- 🌏 语言切换按钮（位于「导出」左侧） -->
    <div class="nav-group topbar-lang">
      <button class="btn" id="btn-lang" data-i18n-title="切换语言 / Switch language" title="切换语言 / Switch language" aria-haspopup="false">
        <span aria-hidden="true">🌏</span>
        <span id="lang-label">中文</span>
      </button>
    </div>

    <div class="nav-group topbar-export">
      <div class="dropdown">
        <button class="btn" id="btn-export" title="分享发布" aria-haspopup="true" aria-expanded="false" data-i18n-title="分享发布">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></span><span data-i18n="导出">导出</span>
          <span class="caret" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="dropdown-panel" id="export-menu" hidden>
          <div class="dd-group">
            <div class="dd-group-label" data-i18n="分享发布">分享发布</div>
            <button class="dd-item" data-act="html">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21.5"/></svg></span>
              <span class="dd-text"><b id="dd-html-label" data-i18n="导出为查看器">导出为查看器</b><small id="dd-html-sub" data-i18n="当前目录 → 独立 HTML 查看器">当前目录 → 独立 HTML 查看器</small></span>
            </button>
            <button class="dd-item" data-act="bundle-zip">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8M12 12v8"/></svg></span>
              <span class="dd-text"><b data-i18n="3D物体包(与剧情编辑器互通)">3D物体包(与剧情编辑器互通)</b><small data-i18n=".jgl，GLB 裸文件外挂，体积更小">.jgl，GLB 裸文件外挂，体积更小</small></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 侧边树 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <span data-i18n="资源">资源</span>
        <span id="tree-stats" style="font-size:11px;color:var(--txt-3)"></span>
      </div>
      <input type="search" id="tree-search" class="tree-search" placeholder="过滤模型 / 文件夹…" autocomplete="off" spellcheck="false" data-i18n-ph="过滤模型 / 文件夹…">
    </div>
    <div class="sidebar-actions">
      <button class="btn" id="btn-new-folder" title="新建文件夹 (Ctrl+N)" data-i18n="新建文件夹">新建文件夹</button>
      <button class="btn primary" id="btn-upload" title="上传 GLB (Ctrl+U)" data-i18n="上传 GLB">上传 GLB</button>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <section class="viewer-pane">
      <div id="viewer-canvas"></div>
      <div class="viewer-overlay" id="viewer-overlay">
        <div class="overlay-card" id="ov-info" data-i18n="3D 查看器就绪">3D 查看器就绪</div>
        <div class="overlay-card dim" id="ov-stats"></div>
      </div>
      <div class="viewer-corner-bar" id="viewer-corner-bar">
        <button class="viewer-fab" id="btn-toggle-panel" title="显示 / 隐藏属性面板（窄屏为抽屉）" data-i18n-title="显示 / 隐藏属性面板（窄屏为抽屉）">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></span>
          <span class="label" id="toggle-panel-label" data-i18n="隐藏面板">隐藏面板</span>
        </button>
        <span class="fab-sep"></span>
        <span class="fab-group">
          <button class="viewer-fab" id="btn-reset-cam" title="重置视角：回到该模型设置好的默认视角；未设置则自动取景" data-i18n-title="重置视角：回到该模型设置好的默认视角；未设置则自动取景">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span>
            <span class="label" data-i18n="重置视角">重置视角</span>
          </button>
          <button class="viewer-fab viewer-fab-sub" id="btn-set-default-view" title="将当前视角保存为该模型的默认视角" data-i18n-title="将当前视角保存为该模型的默认视角">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span>
            <span class="label" data-i18n="设为默认">设为默认</span>
          </button>
        </span>
        <span class="fab-sep"></span>
        <button class="viewer-fab" id="btn-rotate" title="切换自动旋转" data-i18n-title="切换自动旋转">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 4v4h-4"/></svg></span>
          <span class="label" data-i18n="切换自动旋转">切换自动旋转</span>
        </button>
      </div>
      <div class="viewer-empty hidden" id="viewer-empty">
        <div class="big-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21.5"/></svg>
        </div>
        <div class="hint" data-i18n="从左侧选择 GLB 模型，或上传新文件">从左侧选择 GLB 模型，或上传新文件</div>
      </div>
      <div class="viewer-object-chip hidden" id="viewer-object-chip"></div>
    </section>

    <div class="splitter" id="panel-splitter"></div>

    <aside class="side-panel">
      <div class="panel-tabs">
        <div class="panel-tab active" data-tab="props" data-i18n="属性">属性</div>
        <div class="panel-tab" data-tab="sounds" data-i18n="音效库">音效库</div>
      </div>
      <div class="panel-body" id="tab-props">
        <div id="info-content">
          <div class="empty-grid" style="height:auto;padding:20px 0">
            <div class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21.5"/></svg>
            </div>
            <div class="hint" data-i18n="选择一个模型查看详情">选择一个模型查看详情</div>
          </div>
        </div>
        <div id="folder-content" class="hidden"></div>
      </div>
      <div class="panel-body hidden" id="tab-sounds">
        <div id="sounds-content"></div>
      </div>
    </aside>
  </main>

  <!-- 交互链（解谜顺序）：底部停靠条，随选中模型是否有可交互部位而显隐 -->
  <div class="chain-dock" id="chain-dock" hidden>
    <div class="chain-bar">
      <span class="chain-title" data-i18n="交互链（解谜顺序）">交互链（解谜顺序）</span>
      <button class="chain-add" id="chain-add" title="新建一条交互链" data-i18n="+ 新建交互链">+ 新建交互链</button>
      <span class="chain-hint" data-i18n="拖动部位块调整先后顺序；未加入任何链的部位可任意触发">拖动部位块调整先后顺序；未加入任何链的部位可任意触发</span>
    </div>
    <div class="chain-body" id="chain-body"></div>
  </div>

  <!-- 状态栏 -->
  <footer class="statusbar">
    <span class="item" id="stat-models">模型: 0</span>
    <span class="item" id="stat-folders">文件夹: 0</span>
    <span class="item" id="stat-storage">存储: 0 KB</span>
    <span class="item" id="stat-selected">选中: —</span>
    <span style="flex:1"></span>
    <span class="item" id="stat-saved"></span>
    <span class="item ok" id="stat-status">就绪</span>
  </footer>
</div>

<!-- 项目列表页（启动首先显示，选择一个项目后才进入编辑器） -->
<div id="projects-screen" class="projects-screen">
  <div class="projects-inner">
    <div class="projects-header">
      <div class="projects-brand">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21.5"/></svg>
        </span>
        <span data-i18n="3D交互制作器">3D交互制作器</span>
      </div>
      <button class="btn primary" id="btn-new-project" data-i18n="新建项目">新建项目</button>
    </div>
    <div class="projects-sub" data-i18n="选择一个项目开始，或新建一个项目。各项目完全独立，互不影响。">选择一个项目开始，或新建一个项目。各项目完全独立，互不影响。</div>
    <div class="project-list" id="project-list"></div>
  </div>
  <div class="projects-drop-overlay" id="projects-drop-overlay" hidden>
    <div class="drop-card">
      <span class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
      </span>
      <div class="drop-title" data-i18n="松开以导入">松开以导入</div>
      <div class="drop-hint" data-i18n="将项目文件（.json）拖入此处，会新建项目并自动打开">将项目文件（.json）拖入此处，会新建项目并自动打开</div>
    </div>
  </div>
</div>

<!-- 模态对话框 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title" data-i18n="新建文件夹">新建文件夹</h3>
    <label id="modal-label" data-i18n="名称">名称</label>
    <input type="text" id="modal-input" placeholder="">
    <div id="modal-extra"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel" data-i18n="取消">取消</button>
      <button class="btn primary" id="modal-ok" data-i18n="确定">确定</button>
    </div>
  </div>
</div>

<!-- 隐藏的文件上传 input -->
<input type="file" id="file-input" accept=".glb,.gltf" multiple style="display:none">
<!-- 隐藏的音效上传 input -->
<input type="file" id="sound-input" accept="audio/*" multiple style="display:none">

<!-- Toast 容器 -->
<div class="toast-container" id="toasts"></div>

<!-- 资源树右键上下文菜单 -->
<div class="ctx-menu" id="tree-ctx-menu" hidden>
  <button class="ctx-item" data-act="rename" data-i18n="重命名">重命名</button>
  <button class="ctx-item" data-act="duplicate" data-i18n="复制">复制</button>
  <button class="ctx-item" data-act="export" data-i18n="导出 .jgl">导出 .jgl</button>
  <div class="ctx-sep"></div>
  <button class="ctx-item ctx-danger" data-act="delete" data-i18n="删除">删除</button>
</div>

<!-- 命令面板 (Ctrl/Cmd+K) -->
<div class="cmd-palette" id="cmd-palette" hidden>
  <div class="cmd-box">
    <div class="cmd-input-wrap">
      <input type="text" id="cmd-input" class="cmd-input" placeholder="输入命令，如：上传、导出、重置视角…" autocomplete="off" spellcheck="false" data-i18n-ph="输入命令，如：上传、导出、重置视角…">
      <button class="cmd-close" id="cmd-close" title="关闭（Esc）" aria-label="关闭命令面板" data-i18n-aria="关闭命令面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="cmd-results" id="cmd-results"></div>
    <div class="cmd-foot"><span data-i18n="↑↓ 选择">↑↓ 选择</span><span data-i18n="↵ 执行">↵ 执行</span><span data-i18n="Esc 关闭">Esc 关闭</span></div>
  </div>
</div>

<!-- 传统 UMD 脚本加载 Three.js（本地 vendor，彻底离线，file:// 双击直开可用，无需本地服务器 / 无需联网） -->
<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
<script src="vendor/three/GLTFLoader.js"></script>
<script src="vendor/three/RGBELoader.js"></script>
<script src="vendor/three/EXRLoader.js"></script>
<!-- HDRI 环境贴图数据（base64 内联，file:// 双击离线可用，无需联网读取本地文件） -->
<script src="assets/hdri/urban.js"></script>
<script src="assets/hdri/indoor.js"></script>
<script src="assets/hdri/blue.js"></script>
<script src="assets/hdri/purple.js"></script>
<script src="assets/hdri/snow.js"></script>
<script src="assets/hdri/grotto.js"></script>
<script src="assets/hdri/forest.js"></script>
<script>
  // UMD 版已把 THREE / THREE.OrbitControls / THREE.GLTFLoader 挂到全局，通知主程序 Three.js 就绪
  window._threeReady = true;
  if (window._onThreeReady) window._onThreeReady();
</script>

<!-- 传统 <script>：同步加载，file:// 协议下正常工作 -->
<script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/zip.js?v=20260723-01"></script>
  <script src="js/exporter.js"></script>
<script src="js/viewer.js"></script>
<script src="js/i18n.js"></script>
<script src="js/version.js"></script>
<script src="js/main.js"></script>
</body>
</html>
